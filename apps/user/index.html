const BOT='<svg viewBox="0 0 64 64"><circle cx="32" cy="30" r="26" fill="var(--a)"/><path d="M47 47l11 11-15-3z" fill="var(--a)"/><path d="M20 19h24v26l-4-3-4 3-4-3-4 3-4-3-4 3z" fill="#fff"/><rect x="23" y="24" width="18" height="9" rx="4.5" fill="#374151"/><circle cx="28" cy="28.5" r="2" fill="#38bdf8"/><circle cx="36" cy="28.5" r="2" fill="#38bdf8"/><path d="M32 19v-4" stroke="#fff" stroke-width="2"/><circle cx="32" cy="13" r="2.2" fill="#fff"/><text x="32" y="41" font-size="7" text-anchor="middle" fill="var(--a)" font-weight="700">₹</text></svg>';
const QK=['Last week history PDF','Today history PDF','How to bill?','Add a product','Call owner','WhatsApp owner'];
function fabUpd(){let f=g('fab');if(!f){document.body.insertAdjacentHTML('beforeend',`<button id="fab" aria-label="Help chat" onclick="chatOpen(1)">${BOT}</button><div id="chat"><div class="ch0">${BOT}<b>EasyBill Assistant</b><button onclick="chatOpen(0)" aria-label="Close">×</button></div><div id="cm"></div><div id="cq">${QK.map(q=>`<button onclick="chatSend('${q}')">${q}</button>`).join('')}</div><div id="cr"><input id="ci" placeholder="Ask me anything…" onkeydown="event.key=='Enter'&&chatSend()"><button onclick="chatSend()">Send</button></div></div>`);f=g('fab');say('b','Hi! I can download your bill history as PDF, explain how to use EasyBill, or connect you to the owner. What do you need?')}
const on=S.scr=='app'&&S.tab!='bill';f.style.display=on?'block':'none';if(!on)g('chat').style.display='none'}
const chatOpen=o=>{g('chat').style.display=o?'flex':'none';g('fab').style.display=o?'none':'block'};
function say(w,h){const m=g('cm');m.insertAdjacentHTML('beforeend',`<div class="mg ${w}">${h}</div>`);m.scrollTop=m.scrollHeight}
const NUM=r=>{r=String(r||'');let n=r.replace(/\D/g,'');if(n.length==10)n='91'+n;return n.length>=11&&!/x/i.test(r)?n:''};
const KB=[[/(add|new|create).*(product|item)|product/,'Open Products from the footer and tap + Add. Fill name, code, category, unit, stock, price, GST and an optional image. In Wholesale also enter the minimum billing quantity.'],[/discount/,'Discount is Retail only. On the review screen enter the discount % before saving. Wholesale has no final-bill discount.'],[/minimum|wholesale/,'In Wholesale every product has a minimum billing quantity. Items start at that quantity and cannot go below it.'],[/switch|retail|mode/,'Use the Retail | Wholesale switch in the header. Retail and Wholesale keep separate products, bills and history.'],[/account|balance|due|pending|given/,'Open Accounts: enter name, mobile and amount, then Save. Tap Given when paid (stored with the date) or Delete (asks to confirm).'],[/template|printer|print/,'Settings → Bill templates: upload a header image, tap Use to select it, Delete to remove it. The selected template appears on printed and PDF bills.'],[/bill|invoice|billing/,'Open Billing → pick a category → tap + on products → press Bill → add customer details (Retail: discount %) → Save. Then Print or Download PDF.'],[/history/,'History lists every saved bill; tap one to print or download it. Here you can also say "last week history PDF".'],[/password|forgot|login|otp|username/,'Shop accounts are created by the Administrator. If you forgot your username or password, say "call owner".'],[/disable|blocked|suspend/,'A disabled account is blocked until the owner reactivates it. Your data stays safe. Say "call owner" to contact them.'],[/stock|low|zero/,'Home shows Low stock (5 or fewer) and Zero stock counts for the current mode.']];
const rng=l=>{const n=new Date(),sd=d=>{d=new Date(d);d.setHours(0,0,0,0);return d.getTime()},D=864e5;if(/yesterday/.test(l))return['Yesterday',sd(n)-D,sd(n)-1];if(/today/.test(l))return['Today',sd(n),Date.now()];if(/last month/.test(l))return['Last month',new Date(n.getFullYear(),n.getMonth()-1,1).getTime(),new Date(n.getFullYear(),n.getMonth(),1).getTime()-1];if(/month/.test(l))return['This month',new Date(n.getFullYear(),n.getMonth(),1).getTime(),Date.now()];if(/year/.test(l))return['This year',new Date(n.getFullYear(),0,1).getTime(),Date.now()];if(/week|7 ?day/.test(l))return['Last 7 days',sd(n)-6*D,Date.now()];return null};
function histPdf(r,m){if(!window.jspdf)return say('b','The PDF tool is still loading. Please try again in a moment.');const b=(CACHE['eb_'+S.A.id+'_'+m+'_bills']||[]).filter(x=>x.ts>=r[1]&&x.ts<=r[2]),md=m=='r'?'Retail':'Wholesale';if(!b.length)return say('b',`No ${md} bills found for ${r[0].toLowerCase()}.`);
const d=new window.jspdf.jsPDF(),tot=b.reduce((a,x)=>a+x.total,0);let y=18;d.setFontSize(15);d.text(`${S.A.shop} - ${md} bill history`,14,y);d.setFontSize(10);y+=7;d.text(`${r[0]} | ${b.length} bills | Total Rs. ${tot.toFixed(2)}`,14,y);y+=9;d.setFont(undefined,'bold');d.text('Invoice',14,y);d.text('Date',38,y);d.text('Customer',92,y);d.text('Total (Rs.)',196,y,{align:'right'});d.setFont(undefined,'normal');y+=3;d.line(14,y,196,y);y+=6;
b.forEach(x=>{if(y>280){d.addPage();y=18}d.text(x.id,14,y);d.text(String(x.date).slice(0,22),38,y);d.text(String(x.cust).slice(0,28),92,y);d.text(x.total.toFixed(2),196,y,{align:'right'});y+=7});
d.save(`EasyBill-${md}-history-${r[0].replace(/\W+/g,'-')}.pdf`);say('b',`Done! Your ${md} history for <b>${r[0]}</b> (${b.length} bills, Rs. ${tot.toFixed(2)}) has been downloaded as a PDF.`)}
function chatSend(txt){const i=g('ci'),t=(txt||i.value).trim();if(!t)return;i.value='';say('u',esc(t));const l=t.toLowerCase(),ph=NUM(window.EB_OWNER_PHONE),wa=NUM(window.EB_OWNER_WHATSAPP||window.EB_OWNER_PHONE);
if(/whatsapp|chat (with )?(the )?(owner|easy ?bill|support)|message (the )?owner/.test(l)){if(!wa)return say('b','The owner WhatsApp number is not set yet. Please ask the administrator.');const u=`https://wa.me/${wa}?text=${encodeURIComponent('Hello EasyBill, I am from '+S.A.shop)}`;window.open(u,'_blank');return say('b',`Opening WhatsApp… <a class="cb" target="_blank" rel="noopener" href="${u}">Chat on WhatsApp</a>`)}
if(/\b(call|phone|dial|ring)\b|contact (the )?(owner|easy ?bill|support)|talk to (the )?owner/.test(l)){if(!ph)return say('b','The owner phone number is not set yet. Please ask the administrator.');location.href='tel:+'+ph;return say('b',`Opening your phone dialer… <a class="cb" href="tel:+${ph}">Call owner</a>`)}
if(/(history|bills?|report|sales)/.test(l)&&/(pdf|download|last|week|today|yesterday|month|year)/.test(l)){const r=rng(l);if(!r)return say('b','Which period do you need? Say today, yesterday, last week, this month, last month or this year.');return histPdf(r,/wholesale/.test(l)?'w':/retail/.test(l)?'r':S.m)}
const k=KB.find(x=>x[0].test(l));if(k)return say('b',k[1]);
say('b',/^(hi|hello|hey|vanakkam)/.test(l)?'Hello! Ask me about billing, products, accounts or history, or say "last week history PDF".':'Sorry, I did not get that. Try "how to bill", "last week history PDF", "call owner" or "WhatsApp owner".')}

draw();
</script></body></html>
