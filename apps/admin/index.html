const tm=(id,k)=>{const a=D.accounts.find(x=>x.id==id),cur=a.modes||'rw',on=cur.includes(k),nx=['r','w'].filter(z=>z==k?!on:cur.includes(z)).join(''),nm=k=='r'?'Retail':'Wholesale';if(!nx)return toast('At least one mode must stay ON. Use Disable to block the whole shop.');if(confirm((on?'Close ':'Open ')+nm+' billing for '+a.shop+'?'))act('/api/admin/accounts/'+id,'PATCH',{modes:nx},nm+(on?' closed':' opened'))};
const shops=A=>A.filter(a=>(a.shop+a.user+a.mobile).toLowerCase().includes(sq.toLowerCase())).map(a=>`<div class="sh"><div class="top"><div class="th">${I('shop',22)}</div><div class="g"><b>${esc(a.shop)}</b><small>${esc(a.user)} · ${esc(a.mobile)}</small></div><span class="bd ${a.active?'g':'r'}">${a.active?'Active':'Disabled'}</span></div><div class="cn"><span class="chip" style="margin:0">Retail bills: ${a.r}</span><span class="chip" style="margin:0">Wholesale bills: ${a.w}</span><span class="chip" style="margin:0;background:#f3f4f6;color:#6b7280">Last bill: ${esc(a.last||'—')}</span></div><div class="row">${MB(a)}</div><div class="row">${a.active?`<button class="bt sm w" onclick="tgl('${a.id}',1)">${I('ban',15)}Disable</button>`:`<button class="bt sm gr" onclick="tgl('${a.id}',0)">${I('check',15)}Activate</button>`}<button class="bt sm r" onclick="delA('${a.id}')">${I('trash',15)}Delete</button></div></div>`).join('')||`<div class="em">${I('shop',34)}<b>No shops found</b></div>`;
function draw(){if(!TOK){$.innerHTML=`<div class="al"><div class="orb o1"></div><div class="orb o2"></div><div class="alc"><div class="lgb">${LOGO}</div><h1>EasyBill Admin</h1><p class="sub">Sign in to manage shops, access and categories</p><div class="card"><label style="margin-top:0">Admin username</label><input class="in" id="au" autocomplete="username"><label>Password</label><input class="in" id="ap" type="password" autocomplete="current-password" onkeydown="event.key=='Enter'&&alog()"><p class="er" id="err"></p><button class="bt" onclick="alog()">Sign in</button>${DEMO?'<p class="note" style="text-align:center">Demo: admin / admin123</p>':''}</div></div></div>`;return}
const A=D.accounts,R_=A.reduce((s,a)=>s+a.r,0),W_=A.reduce((s,a)=>s+a.w,0),mx=Math.max(1,...A.map(a=>a.r+a.w)),T=[['ov','home','Overview'],['ac','shop','Shops'],['ca','tag','Categories']];let b='';
if(tb=='ov')b=`${S3('Platform at a glance')}<div class="hero"><small>Total bills across all shops</small><b>${R_+W_}</b><span>${A.length} shops · ${A.filter(a=>a.active).length} active · ${A.filter(a=>!a.active).length} disabled</span></div><div class="kg">${[['shop','Registered shops',A.length],['check','Active',A.filter(a=>a.active).length],['ban','Disabled',A.filter(a=>!a.active).length],['bill','Retail / Wholesale bills',R_+' / '+W_]].map(k=>`<div class="k"><i>${I(k[0],20)}</i><div><b>${k[2]}</b><span>${k[1]}</span></div></div>`).join('')}</div><div class="card"><h3>Retail vs Wholesale bills</h3><div class="lgd">${donut([R_,W_],['#4f46e5','#10b981'],120)}<div><i style="background:#4f46e5"></i>Retail ${R_}<br><i style="background:#10b981"></i>Wholesale ${W_}</div></div></div><div class="card"><h3>Bills per shop</h3>${A.slice(0,8).map(a=>`<div style="margin-bottom:12px;font-size:12px"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><b>${esc(a.shop)}</b><span>${a.r+a.w}</span></div><div style="height:10px;background:#eef0ff;border-radius:9px"><div style="height:10px;width:${(a.r+a.w)/mx*100}%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:9px"></div></div></div>`).join('')||'<p class="note">No data yet</p>'}</div>`;
else if(tb=='ac')b=`<div class="card"><h3>Create shop account</h3><div class="fg"><div><label>Shop name</label><input class="in" id="ns"></div><div><label>Username</label><input class="in" id="nu"></div><div><label>Password</label><input class="in" id="np"></div><div><label>Mobile number</label><input class="in" id="nm" maxlength="10" inputmode="numeric"></div><div><label>Billing access</label><select class="in" id="nmd"><option value="rw">Retail + Wholesale</option><option value="r">Retail only</option><option value="w">Wholesale only</option></select></div></div><p class="er" id="err"></p><button class="bt" style="width:auto;padding:12px 24px" onclick="mk()">${I('plus',18)}Create account</button></div><div class="h" style="font-size:16px">Monitor shops</div><div class="sr">${I('search',18)}<input class="in" placeholder="Search shop, username or mobile" value="${esc(sq)}" oninput="sq=this.value;g('sl').innerHTML=shops(D.accounts)"></div><div id="sl">${shops(A)}</div>`;
else b=`<div class="card"><h3>Product categories (shown to every shop)</h3><div style="display:flex;gap:10px"><input class="in" id="nc" placeholder="New category name" onkeydown="event.key=='Enter'&&addC()"><button class="bt sm" onclick="addC()">${I('plus',16)}Add</button></div><div style="margin-top:16px">${D.cats.map((c,i)=>`<span class="chip">${esc(c)}<button onclick="delC(${i})" aria-label="Remove">${I('x',14)}</button></span>`).join('')}</div></div>`;
$.innerHTML=`<header class="hd ghd"><div class="lg0" onclick="tb='ov';draw()" role="button" aria-label="Overview">${LOGO}</div><div class="ht"><b>EasyBill Admin</b><small>Role: Admin</small></div><button class="ib" onclick="out()" aria-label="Sign out">${I('out',20)}</button></header><main class="m-${tb}">${b}</main><footer>${T.map(t=>`<button class="${tb==t[0]?'on':''}" onclick="tb='${t[0]}';draw()">${I(t[1],23)}${t[2]}</button>`).join('')}</footer>`}
TOK?load():draw();
</script></body></html>
